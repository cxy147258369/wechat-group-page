<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Base64 跳转链接生成器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f0f2f5;
    min-height: 100vh;
    padding: 40px 20px;
  }
  .container {
    max-width: 640px;
    margin: 0 auto;
    background: #fff;
    border-radius: 12px;
    padding: 32px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  }
  h1 {
    font-size: 22px;
    color: #1a1a1a;
    margin-bottom: 8px;
  }
  .subtitle {
    font-size: 14px;
    color: #999;
    margin-bottom: 28px;
  }
  label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    color: #333;
    margin-bottom: 8px;
  }
  .label-hint {
    font-weight: 400;
    color: #999;
    font-size: 13px;
  }
  input[type="text"] {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
    margin-bottom: 24px;
    outline: none;
    transition: border-color 0.2s;
  }
  input[type="text"]:focus {
    border-color: #6c5ce7;
  }
  .generate-btn {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #6c5ce7, #a855f7);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s;
    margin-bottom: 24px;
  }
  .generate-btn:hover { opacity: 0.9; }
  .generate-btn:active { opacity: 0.8; }
  .result-box {
    display: none;
    background: #f8f9fa;
    border: 1px solid #e9ecef;
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 24px;
    word-break: break-all;
  }
  .result-box.show { display: block; }
  .result-label {
    font-size: 13px;
    color: #666;
    margin-bottom: 8px;
  }
  .result-link {
    font-size: 14px;
    color: #6c5ce7;
    word-break: break-all;
  }
  .copy-btn {
    margin-top: 10px;
    padding: 8px 20px;
    background: #6c5ce7;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
  }
  .copy-btn:hover { background: #5a4bd1; }
  .usage {
    background: #f0f4ff;
    border-radius: 8px;
    padding: 20px;
  }
  .usage h3 {
    font-size: 15px;
    color: #333;
    margin-bottom: 12px;
  }
  .usage ul {
    padding-left: 20px;
  }
  .usage li {
    font-size: 13px;
    color: #666;
    line-height: 2;
  }
</style>
</head>
<body>
<div class="container">
  <h1>生成 Base64 编码的跳转链接</h1>
  <p class="subtitle">支持自定义参数名</p>

  <label>目标 URL（要跳转到的地址）</label>
  <input type="text" id="targetUrl" placeholder="https://example.com/page">

  <label>你的前端页面地址 <span class="label-hint">（托管 redirect.html 的地方）</span></label>
  <input type="text" id="frontendUrl" placeholder="https://yoursite.github.io/repo/redirect.html">

  <label>参数名 <span class="label-hint">（默认：c）</span></label>
  <input type="text" id="paramName" value="c" placeholder="c">

  <button class="generate-btn" onclick="generate()">生成跳转链接</button>

  <div class="result-box" id="resultBox">
    <div class="result-label">生成的跳转链接：</div>
    <div class="result-link" id="resultLink"></div>
    <button class="copy-btn" onclick="copyLink()">复制链接</button>
  </div>

  <div class="usage">
    <h3>📖 使用说明</h3>
    <ul>
      <li>将 redirect.html 上传到你的静态托管服务（GitLab Pages、GitHub Pages、Vercel 等）</li>
      <li>在上方输入你的目标 URL 和前端页面地址</li>
      <li>点击生成按钮获取跳转链接</li>
      <li>访问生成的链接会自动跳转到目标地址</li>
      <li>支持中文 URL（自动 UTF-8 编码）</li>
    </ul>
  </div>
</div>

<script>
function toBase64(str) {
  return btoa(unescape(encodeURIComponent(str))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

function generate() {
  var target = document.getElementById('targetUrl').value.trim();
  var frontend = document.getElementById('frontendUrl').value.trim();
  var param = document.getElementById('paramName').value.trim() || 'c';

  if (!target) { alert('请输入目标 URL'); return; }
  if (!frontend) { alert('请输入前端页面地址'); return; }

  var encoded = toBase64(target);
  var separator = frontend.indexOf('?') >= 0 ? '&' : '?';
  var link = frontend + separator + param + '=' + encoded;

  document.getElementById('resultLink').textContent = link;
  document.getElementById('resultBox').classList.add('show');
}

function copyLink() {
  var text = document.getElementById('resultLink').textContent;
  navigator.clipboard.writeText(text).then(function() {
    var btn = document.querySelector('.copy-btn');
    btn.textContent = '已复制！';
    setTimeout(function() { btn.textContent = '复制链接'; }, 1500);
  });
}
</script>
</body>
</html>
