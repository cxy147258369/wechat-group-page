<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>跳转中...</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #f5f5f5;
    color: #666;
    font-size: 16px;
  }
  .loading {
    text-align: center;
  }
  .spinner {
    width: 36px;
    height: 36px;
    border: 3px solid #e0e0e0;
    border-top-color: #07c160;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error { color: #e74c3c; }
</style>
</head>
<body>
<div class="loading" id="msg">
  <div class="spinner"></div>
  <div>正在跳转...</div>
</div>

<script>
(function() {
  var param = 'c';
  var params = new URLSearchParams(window.location.search);
  var encoded = params.get(param);

  if (!encoded) {
    document.getElementById('msg').innerHTML = '<div class="error">缺少跳转参数</div>';
    return;
  }

  try {
    // Support both standard Base64 and URL-safe Base64
    var base64 = encoded.replace(/-/g, '+').replace(/_/g, '/');
    // Add padding if needed
    while (base64.length % 4 !== 0) base64 += '=';
    var decoded = decodeURIComponent(escape(atob(base64)));
    window.location.replace(decoded);
  } catch (e) {
    document.getElementById('msg').innerHTML = '<div class="error">链接无效，无法跳转</div>';
  }
})();
</script>
</body>
</html>
