<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>梦御の秘密后花园</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
    background-color: #f5f5f5;
    color: #333;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .container {
    max-width: 600px;
    margin: 0 auto;
    width: 100%;
    flex: 1;
    display: flex;
    flex-direction: column;
    background-color: #f5f5f5;
  }

  /* 顶部群信息区域 */
  .group-header {
    text-align: center;
    padding: 30px 20px 20px;
  }

  /* 九宫格头像 */
  .avatar-grid {
    display: grid;
    grid-template-columns: repeat(3, 32px);
    grid-template-rows: repeat(3, 32px);
    gap: 2px;
    justify-content: center;
    margin-bottom: 16px;
  }

  .avatar-grid img {
    width: 32px;
    height: 32px;
    border-radius: 4px;
    object-fit: cover;
  }

  .group-name {
    font-size: 18px;
    font-weight: 500;
    color: #1a1a1a;
    margin-bottom: 8px;
  }

  .privacy-notice {
    font-size: 13px;
    color: #999;
  }

  /* 分割线 */
  .divider {
    border: none;
    border-top: 1px solid #e8e8e8;
    margin: 0;
  }

  /* 群介绍区域 */
  .group-info {
    padding: 24px 20px;
    flex: 1;
  }

  .group-info-item {
    font-size: 14px;
    color: #666;
    line-height: 1.8;
    margin-bottom: 12px;
  }

  .group-info-item::before {
    content: "· ";
    color: #999;
  }

  /* 底部支付按钮 */
  .pay-bar {
    padding: 16px 20px 24px;
    text-align: center;
  }

  .pay-btn {
    display: inline-block;
    background-color: #07c160;
    color: #fff;
    font-size: 16px;
    font-weight: 500;
    padding: 12px 48px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    text-decoration: none;
    transition: background-color 0.2s;
  }

  .pay-btn:hover {
    background-color: #06ad56;
  }

  .pay-btn:active {
    background-color: #059a4c;
  }

  /* 赞赏码弹窗 */
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.6);
    z-index: 1000;
    justify-content: center;
    align-items: center;
  }

  .modal-overlay.active {
    display: flex;
  }

  .modal-content {
    background: #fff;
    border-radius: 12px;
    padding: 24px;
    max-width: 320px;
    width: 90%;
    text-align: center;
    position: relative;
  }

  .modal-content img {
    width: 100%;
    max-width: 280px;
    border-radius: 8px;
  }

  .modal-close {
    position: absolute;
    top: 8px;
    right: 12px;
    font-size: 24px;
    color: #999;
    cursor: pointer;
    background: none;
    border: none;
    line-height: 1;
  }

  .modal-close:hover {
    color: #333;
  }

  .modal-tip {
    margin-top: 12px;
    font-size: 14px;
    color: #666;
  }
</style>
</head>
<body>
<div class="container">
  <!-- 群信息头部 -->
  <div class="group-header">
    <div class="avatar-grid">
      <img src="https://picsum.photos/seed/a1/64/64" alt="">
      <img src="https://picsum.photos/seed/a2/64/64" alt="">
      <img src="https://picsum.photos/seed/a3/64/64" alt="">
      <img src="https://picsum.photos/seed/a4/64/64" alt="">
      <img src="https://picsum.photos/seed/a5/64/64" alt="">
      <img src="https://picsum.photos/seed/a6/64/64" alt="">
      <img src="https://picsum.photos/seed/a7/64/64" alt="">
      <img src="https://picsum.photos/seed/a8/64/64" alt="">
      <img src="https://picsum.photos/seed/a9/64/64" alt="">
    </div>
    <div class="group-name">梦御の秘密后花园 (454)</div>
    <div class="privacy-notice">你和群里其他人都不是朋友关系，请注意隐私安全。</div>
  </div>

  <hr class="divider">

  <!-- 群介绍 -->
  <div class="group-info">
    <div class="group-info-item">该群聊人数较多，请速度加入！</div>
    <div class="group-info-item">为维护微信平台绿色网络环境，请勿在群内传播违法违规内容。</div>
    <div class="group-info-item">群介绍必看：本群是专为夜聊的伙伴打造。群费不多不少，买个信任，做付费群只为过滤人群-减少一些牛鬼蛇神，避免人多嘴杂。</div>
  </div>

  <!-- 支付按钮 -->
  <div class="pay-bar">
    <button class="pay-btn" onclick="showQR()">立即支付9.7元入群</button>
  </div>
</div>

<!-- 赞赏码弹窗 -->
<div class="modal-overlay" id="qrModal" onclick="closeQR(event)">
  <div class="modal-content">
    <button class="modal-close" onclick="closeQR(event)">&times;</button>
    <img src="qr-code.jpg" alt="微信赞赏码">
    <div class="modal-tip">微信扫码支付 9.7 元入群</div>
  </div>
</div>

<script>
function showQR() {
  document.getElementById('qrModal').classList.add('active');
}

function closeQR(e) {
  if (e.target === document.getElementById('qrModal') || e.target.classList.contains('modal-close')) {
    document.getElementById('qrModal').classList.remove('active');
  }
}
</script>
</body>
</html>
